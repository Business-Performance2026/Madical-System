<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موعد | حجز موعد</title>
  <!-- إعدادات تطبيق الجوال (Add to Home Screen) -->
  <link rel="manifest" href="../manifest.json">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js').catch(() => {});</script>
  <link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="../assets/icons/icon-152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <meta name="theme-color" content="#05314D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="موعد">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard">

  <div class="dashboard-shell">

    <header class="dashboard-header">
      <div class="header-brand">
        <div class="brand-mark">
          <img src="../assets/logo.jpg" alt="موعد" class="brand-logo-img">
        </div>
        <div class="header-titles">
          <p class="brand-title">موعد</p>
          <p class="brand-subtitle"><span data-i18n="welcome_prefix">مرحباً، </span><span id="patient-name">...</span></p>
        </div>
      </div>
    </header>

    <div id="guest-banner-wrap"></div>

    <div class="page-tabs">
      <button type="button" class="active" data-tab="booking" data-i18n="tab_new_booking">احجز موعد جديد</button>
      <button type="button" data-tab="appointments" data-i18n="tab_appointments">مواعيدي</button>
      <button type="button" data-tab="account" data-i18n="tab_account">حسابي</button>
    </div>

    <section class="section-card tab-panel" data-panel="booking">
      <h2 class="section-title" data-i18n="section_new_booking_title">احجز موعد جديد</h2>
      <p class="section-hint" data-i18n="section_new_booking_hint">اختر العيادة، بعدين الطبيب، وبنعرض لك بس الأوقات المتاحة فعلياً</p>
      <div id="booking-steps" class="loading-state" data-i18n="loading">جاري التحميل...</div>
    </section>

    <section class="section-card tab-panel hidden" data-panel="appointments">
      <h2 class="section-title" data-i18n="section_upcoming_title">مواعيدي الحالية</h2>
      <div id="upcoming-appts-wrap" class="loading-state" data-i18n="loading">جاري التحميل...</div>
      <div id="my-waitlist-wrap"></div>

      <h2 class="section-title" style="margin-top:30px;" data-i18n="section_past_title">مواعيدي السابقة</h2>
      <div id="past-appts-wrap" class="loading-state" data-i18n="loading">جاري التحميل...</div>
    </section>

    <section class="section-card tab-panel hidden" data-panel="account">
      <h2 class="section-title" data-i18n="tab_account">حسابي</h2>

      <div class="account-menu">
        <button type="button" class="account-menu-item" id="account-notifications-btn">
          <span class="account-menu-icon">🔔</span>
          <span class="account-menu-label" data-i18n="account_notifications">الإشعارات</span>
          <span class="notif-badge hidden" id="account-notif-badge">0</span>
        </button>
        <button type="button" class="account-menu-item" id="account-language-btn">
          <span class="account-menu-icon">🌐</span>
          <span class="account-menu-label" data-i18n="account_language">اللغة</span>
        </button>
        <button type="button" class="account-menu-item" id="account-help-btn">
          <span class="account-menu-icon">🆘</span>
          <span class="account-menu-label" data-i18n="account_help">مساعدة</span>
        </button>
      </div>

      <div class="account-menu account-danger-zone">
        <button type="button" class="account-menu-item" id="account-logout-btn">
          <span class="account-menu-icon">🚪</span>
          <span class="account-menu-label" data-i18n="logout">تسجيل الخروج</span>
        </button>
        <button type="button" class="account-menu-item account-danger" id="account-delete-btn">
          <span class="account-menu-icon">🗑️</span>
          <span class="account-menu-label" data-i18n="account_delete">حذف حسابي</span>
        </button>
      </div>
    </section>

  </div>

  <nav class="bottom-nav">
    <a href="../index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
      <span data-i18n="bottom_nav_home">الرئيسية</span>
    </a>
    <a href="../index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 21V7l7-4 7 4v14h-6v-6h-2v6zm4-8h2V9H9zm4 0h2V9h-2zM9 9h2V9zm4 0h2V9z"/></svg>
      <span data-i18n="bottom_nav_clinics">العيادات</span>
    </a>
    <button type="button" class="bottom-nav-center" id="bottom-nav-book" aria-label="احجز الآن">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14zm0-12H5V6h14z"/><path fill="currentColor" d="M11 12h2v2h-2zM7 12h2v2H7zM15 12h2v2h-2z"/></svg>
    </button>
    <button type="button" class="bottom-nav-item" id="bottom-nav-appointments">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v2H4zm0 5h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
      <span data-i18n="bottom_nav_appointments">مواعيدي</span>
      <span class="notif-badge hidden bottom-nav-badge" id="bottom-nav-appointments-badge">0</span>
    </button>
    <button type="button" class="bottom-nav-item" id="bottom-nav-profile">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>
      <span data-i18n="bottom_nav_profile">حسابي</span>
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="../js/i18n.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/patient.js"></script>
</body>
</html>
