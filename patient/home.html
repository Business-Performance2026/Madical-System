<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موعد | حجز موعد</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard">

  <div class="dashboard-shell">

    <header class="dashboard-header">
      <div class="header-brand">
        <div class="brand-mark">
          <img src="../assets/logo.jpg" alt="موعد" class="brand-logo-img">
        </div>
        <div class="header-titles">
          <p class="brand-title">موعد</p>
          <p class="brand-subtitle">مرحباً، <span id="patient-name">...</span></p>
        </div>
      </div>
      <button class="btn-outline" id="logout-btn">تسجيل الخروج</button>
    </header>

    <div class="page-tabs">
      <button type="button" class="active" data-tab="booking">احجز موعد جديد</button>
      <button type="button" data-tab="upcoming">مواعيدي الحالية</button>
      <button type="button" data-tab="past">مواعيدي السابقة</button>
    </div>

    <section class="section-card tab-panel" data-panel="booking">
      <h2 class="section-title">احجز موعد جديد</h2>
      <p class="section-hint">اختر العيادة، بعدين الطبيب، وبنعرض لك بس الأوقات المتاحة فعلياً</p>
      <div id="booking-steps" class="loading-state">جاري التحميل...</div>
    </section>

    <section class="section-card tab-panel hidden" data-panel="upcoming">
      <h2 class="section-title">مواعيدي الحالية</h2>
      <div id="upcoming-appts-wrap" class="loading-state">جاري التحميل...</div>
    </section>

    <section class="section-card tab-panel hidden" data-panel="past">
      <h2 class="section-title">مواعيدي السابقة</h2>
      <div id="past-appts-wrap" class="loading-state">جاري التحميل...</div>
    </section>

  </div>

  <div id="modal-root"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/patient.js"></script>
</body>
</html>
