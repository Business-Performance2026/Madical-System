<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موعد | حجز موعد</title>
  <!-- إعدادات تطبيق الجوال (Add to Home Screen) -->
  <link rel="manifest" href="../manifest.json">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js').catch(() => {});</script>
  <link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="../assets/icons/icon-152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <meta name="theme-color" content="#05314D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="موعد">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard">

  <div class="dashboard-shell">

    <header class="dashboard-header">
      <div class="header-brand">
        <div class="brand-mark">
          <img src="../assets/logo.jpg" alt="موعد" class="brand-logo-img">
        </div>
        <div class="header-titles">
          <p class="brand-title">موعد</p>
          <p class="brand-subtitle"><span data-i18n="welcome_prefix">مرحباً، </span><span id="patient-name">...</span></p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="notif-bell" id="patient-notif-bell" title="التحديثات">
          🔔
          <span class="notif-badge hidden" id="patient-notif-badge">0</span>
        </button>
        <button class="btn-outline" id="logout-btn" data-i18n="logout">تسجيل الخروج</button>
      </div>
    </header>

    <div id="guest-banner-wrap"></div>

    <div class="page-tabs">
      <button type="button" class="active" data-tab="booking" data-i18n="tab_new_booking">احجز موعد جديد</button>
      <button type="button" data-tab="upcoming" data-i18n="tab_upcoming">مواعيدي الحالية</button>
      <button type="button" data-tab="past" data-i18n="tab_past">مواعيدي السابقة</button>
    </div>

    <section class="section-card tab-panel" data-panel="booking">
      <h2 class="section-title" data-i18n="section_new_booking_title">احجز موعد جديد</h2>
      <p class="section-hint" data-i18n="section_new_booking_hint">اختر العيادة، بعدين الطبيب، وبنعرض لك بس الأوقات المتاحة فعلياً</p>
      <div id="booking-steps" class="loading-state" data-i18n="loading">جاري التحميل...</div>
    </section>

    <section class="section-card tab-panel hidden" data-panel="upcoming">
      <h2 class="section-title" data-i18n="section_upcoming_title">مواعيدي الحالية</h2>
      <div id="upcoming-appts-wrap" class="loading-state" data-i18n="loading">جاري التحميل...</div>
      <div id="my-waitlist-wrap"></div>
    </section>

    <section class="section-card tab-panel hidden" data-panel="past">
      <h2 class="section-title" data-i18n="section_past_title">مواعيدي السابقة</h2>
      <div id="past-appts-wrap" class="loading-state" data-i18n="loading">جاري التحميل...</div>
    </section>

  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="../js/i18n.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/patient.js"></script>
</body>
</html>
