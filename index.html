<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">موعد | دليل العيادات واحجز موعدك الطبي</title>
  <!-- إعدادات تطبيق الجوال (Add to Home Screen) -->
  <link rel="manifest" href="manifest.json">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});</script>
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <meta name="theme-color" content="#05314D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="موعد">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing">

  <nav class="landing-nav">
    <div class="nav-top-row">
      <div class="nav-brand">
        <div class="brand-mark">
          <img src="assets/logo.jpg" alt="موعد" class="brand-logo-img">
        </div>
        <span>موعد</span>
      </div>
      <a href="login.html" class="btn-primary" data-i18n="nav_login">تسجيل الدخول</a>
    </div>
    <div class="nav-bottom-row">
      <button type="button" id="search-toggle-btn" class="search-toggle-btn" aria-label="بحث">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
      <button type="button" id="lang-toggle-btn" class="lang-toggle-btn" aria-label="English">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm6.93 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8 8 0 0 1 18.93 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14a7.9 7.9 0 0 1 0-4h3.38a16.6 16.6 0 0 0 0 4zm.81 2h2.95A15.7 15.7 0 0 0 9.4 19.56 8 8 0 0 1 5.07 16zm2.95-8H5.07a8 8 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.02 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66a14.6 14.6 0 0 1 0-4h4.68a14.6 14.6 0 0 1 0 4zm.28 5.56A15.7 15.7 0 0 0 15.98 16h2.95a8 8 0 0 1-4.31 3.56zM16.36 14a16.6 16.6 0 0 0 0-4h3.38a7.9 7.9 0 0 1 0 4z"/></svg>
      </button>
    </div>
  </nav>

  <div class="nav-search-wrap hidden" id="nav-search-wrap">
    <form id="hero-search-form" class="nav-search">
      <input type="text" id="hero-search-input" data-i18n-placeholder="search_placeholder" placeholder="دوّر على تخصص أو اسم عيادة...">
    </form>
  </div>

  <div id="ads-carousel-wrap" class="hidden"></div>

  <main class="directory-section">
    <div class="specialty-filter-bar" id="specialty-filter-bar">
      <button type="button" class="specialty-pill active" data-specialty="">
        <span class="pill-circle">🏥</span>
        <span class="pill-label" data-i18n="spec_all">الكل</span>
      </button>
      <button type="button" class="specialty-pill" data-specialty="أسنان">
        <span class="pill-circle">🦷</span>
        <span class="pill-label" data-i18n="spec_dental">أسنان<span class="pill-count" data-count-for="أسنان"></span></span>
      </button>
      <button type="button" class="specialty-pill" data-specialty="جلدية">
        <span class="pill-circle">🧴</span>
        <span class="pill-label" data-i18n="spec_derma">جلدية<span class="pill-count" data-count-for="جلدية"></span></span>
      </button>
      <button type="button" class="specialty-pill" data-specialty="أطفال">
        <span class="pill-circle">🧸</span>
        <span class="pill-label" data-i18n="spec_peds">أطفال<span class="pill-count" data-count-for="أطفال"></span></span>
      </button>
      <button type="button" class="specialty-pill" data-specialty="باطنية">
        <span class="pill-circle">🩺</span>
        <span class="pill-label" data-i18n="spec_internal">باطنية<span class="pill-count" data-count-for="باطنية"></span></span>
      </button>
      <button type="button" class="specialty-pill" data-specialty="عيون">
        <span class="pill-circle">👁️</span>
        <span class="pill-label" data-i18n="spec_eye">عيون<span class="pill-count" data-count-for="عيون"></span></span>
      </button>
      <button type="button" class="specialty-pill" data-specialty="عظام">
        <span class="pill-circle">🦴</span>
        <span class="pill-label" data-i18n="spec_ortho">عظام<span class="pill-count" data-count-for="عظام"></span></span>
      </button>
    </div>

    <div class="directory-header hidden" id="directory-header">
      <h2 id="directory-title"></h2>
      <p class="section-hint" id="directory-hint"></p>
    </div>

    <section class="carousel-block">
      <div class="carousel-header-row">
        <h3 class="carousel-title carousel-title-sm" data-i18n="section_clinics">العيادات</h3>
        <button type="button" class="view-all-btn" data-target="clinics-carousel-wrap" data-i18n="view_all">عرض الكل</button>
      </div>
      <div id="clinics-carousel-wrap" class="loading-state" data-i18n="loading">جاري التحميل...</div>
    </section>

    <section class="carousel-block">
      <div class="carousel-header-row">
        <h3 class="carousel-title" data-i18n="section_doctors">الأطباء</h3>
        <button type="button" class="view-all-btn" data-target="doctors-carousel-wrap" data-i18n="view_all">عرض الكل</button>
      </div>
      <div id="doctors-carousel-wrap" class="loading-state" data-i18n="loading">جاري التحميل...</div>
    </section>
  </main>

  <div class="cta-banner">
    <h2 data-i18n="cta_title">جاهز تحجز موعدك؟</h2>
    <p data-i18n="cta_sub">سجّل حساب مجاني كمريض، أو سجّل عيادتك عشان تستقبل حجوزات جديدة</p>
    <a href="login.html" class="btn-primary" data-i18n="cta_btn">ابدأ الآن</a>
  </div>

  <footer class="landing-footer" data-i18n="footer_text">© موعد — نظام حجز مواعيد العيادات</footer>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
